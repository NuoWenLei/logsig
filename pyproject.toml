[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logsig"
version = "0.1.0"
description = "Spectral Log Anomaly Detector — production logs as time-domain signals; anomalies as frequency-domain disruptions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "drain3>=0.9.11",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30"]
dev = ["pytest>=7"]

[project.scripts]
logsig = "logsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
